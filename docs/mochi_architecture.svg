<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<title>Mochi system architecture</title>
<desc>The Expo mobile app sends requests to Vercel serverless functions, which route to Google Gemini 2.5 Flash, Microsoft Edge Neural Speech, and Supabase for database and authentication.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="400" fill="#FFFFFF"/>

<!-- Mobile app -->
<rect x="190" y="30" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Mobile app</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Expo, React Native, Expo Router</text>

<line x1="340" y1="86" x2="340" y2="130" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Vercel functions -->
<rect x="210" y="130" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Vercel serverless functions</text>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Holds all API keys, routes requests</text>

<!-- Connectors down to three services -->
<path d="M340 186L340 216L130 216L130 246" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 186L340 246" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 186L340 216L530 216L530 246" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Gemini -->
<rect x="40" y="246" width="180" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Gemini 2.5 Flash</text>
<text x="130" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Reactions, roleplay,</text>
<text x="130" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">insights</text>

<!-- Edge Speech -->
<rect x="240" y="246" width="180" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Edge Neural Speech</text>
<text x="330" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Generates Mochi's</text>
<text x="330" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">spoken voice</text>

<!-- Supabase -->
<rect x="440" y="246" width="180" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Supabase</text>
<text x="530" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">PostgreSQL + auth,</text>
<text x="530" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">per-user data access</text>

<!-- Legend -->
<circle cx="60" cy="352" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="356" font-family="sans-serif" font-size="12" fill="#3D3D3A">Mochi's own app + backend</text>
<circle cx="320" cy="352" r="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="332" y="356" font-family="sans-serif" font-size="12" fill="#3D3D3A">External services</text>
</svg>
